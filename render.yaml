services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_USER_ID
        value: "1"
